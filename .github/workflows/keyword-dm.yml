name: keyword-dm
on:
  schedule:
    # hourly at :43 (was */30 — Meta hardening 2026-10-02: 48 CI runs/day was
    # noise while the kill switch is off; when enabled, replies land within ~1h)
    - cron: "43 * * * *"
  workflow_dispatch: {}

permissions:
  # write: the reply log must be committed back, or every hourly run would
  # start with an empty sent-set and re-serve the same comment forever.
  contents: write

concurrency:
  group: keyword-dm
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GRAPH_VERSION: v23.0
      # Kill switch ON (2026-10-07, end goal = sales): the bot only acts on
      # posts whose caption says COMMENT "<keyword>" — no such post, no sends.
      REPLY_BOT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Serve comment-keyword requests
        run: python scripts/reply_bot.py --all
      - name: Commit reply log (dedup across runs)
        run: |
          if [ -f data/dm_log.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dm_log.csv
            if git diff --cached --quiet; then
              echo "no new replies"
            else
              git commit -m "log: dm replies $(date -u +%FT%TZ)"
              git pull --rebase origin main || true
              git push
            fi
          fi
