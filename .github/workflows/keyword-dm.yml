name: keyword-dm
on:
  schedule:
    # hourly at :43 (was */30 — Meta hardening 2026-10-02: 48 CI runs/day was
    # noise while the kill switch is off; when enabled, replies land within ~1h)
    - cron: "43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keyword-dm
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GRAPH_VERSION: v23.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Serve comment-keyword requests
        run: python scripts/reply_bot.py --all
