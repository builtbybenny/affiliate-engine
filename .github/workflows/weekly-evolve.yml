name: weekly-evolve
on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Trend radar scan
        run: python scripts/radar.py
      - name: Research briefs (blogs -> per-product SEO keywords + facts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/research_brief.py --all
      - name: Commit radar + research briefs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar_candidates.json data/radar_digest_*.md data/research_briefs.json
          git commit -m "evolve: weekly scan + research briefs $(date -u +%F)" || echo "nothing new"
          git push
