name: scheduler
on:
  schedule:
    # RAMP MODE (decided 2026-10-02): 1 post/day while the account is <2 weeks
    # old — re-check ~2026-10-15, then re-add the 12:30 UTC carousel slot for 2/day.
    # Evening US-prime window only, at deliberately odd minutes: posting at
    # 23:30 sharp every day is a bot tell. Four triggers + a guard + a random
    # draw = exactly one post per day, at a different time each day.
    - cron: "9 23 * * *"   # ~19:09 ET
    - cron: "27 23 * * *"  # ~19:27 ET
    - cron: "46 23 * * *"  # ~19:46 ET
    - cron: "57 23 * * *"  # ~19:57 ET — forced fallback if earlier draws passed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: affiliate-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      GRAPH_VERSION: v23.0
      BRAND_NAME: Stack & Save
      BRAND_HANDLE: "@stackandsavehq"
      # Optional boosters: empty secret = graceful fallback (templates/gradients)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute Pages URL (free hosting)
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          REPO=${GITHUB_REPOSITORY#*/}
          echo "PUBLIC_MEDIA_BASE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"

      - name: Decide today's slot (ramp guard + randomized draw)
        id: slot
        run: |
          python - <<'PY'
          import csv, datetime, os, random
          utc = datetime.datetime.utcnow()
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          fmt = "carousel" if utc.hour == 12 else "reel"
          # publish.py logs dates under config.now_local() = IST (UTC+05:30)
          today = (utc + datetime.timedelta(hours=5, minutes=30)).date().isoformat()
          posted = set()
          try:
              with open("data/published_log.csv", newline="", encoding="utf-8") as f:
                  posted = {r[0] for r in list(csv.reader(f))[1:] if r}
          except FileNotFoundError:
              pass
          if manual:
              run, why = True, "manual dispatch"
          elif today in posted:
              run, why = False, f"ramp guard: already posted {today}"
          elif (utc.hour, utc.minute) >= (23, 55):
              run, why = True, "last trigger of the window — forced"
          else:
              t = (utc.hour, utc.minute)
              p = 0.35 if t < (23, 20) else 0.55 if t < (23, 40) else 0.7
              run = random.random() < p
              why = f"draw p={p} -> {'post' if run else 'pass'}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"format={fmt}\nrun={str(run).lower()}\n")
          print(f"{fmt} @ {utc:%H:%M}Z: {why}")
          PY

      - name: Randomize exact time inside the slot
        if: steps.slot.outputs.run == 'true'
        run: sleep $((RANDOM % 170))

      # Reels are rendered with ffmpeg; runner images do NOT ship it
      # (first-ever run failed 2026-10-01 on exactly this).
      - name: Install ffmpeg (reels)
        if: steps.slot.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install deps
        if: steps.slot.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate media
        if: steps.slot.outputs.run == 'true'
        run: python scripts/generate.py --today --format ${{ steps.slot.outputs.format }}

      - name: Copy media into docs/ for GitHub Pages
        if: steps.slot.outputs.run == 'true'
        run: |
          mkdir -p docs/media
          cp -r public/media/* docs/media/
          # keep the link-in-bio page in sync with products.csv
          if [ -f public/index.html ]; then cp public/index.html docs/index.html; fi

      - name: Commit media to Pages
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/media
          git commit -m "media: ${{ steps.slot.outputs.format }} $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Wait until Pages serves the new files
        if: steps.slot.outputs.run == 'true'
        run: |
          sleep 60
          python - <<'PY'
          import os, time, requests
          from pathlib import Path
          base = os.environ["PUBLIC_MEDIA_BASE_URL"]
          files = [f for f in Path("docs/media").rglob("*") if f.is_file()]
          if not files:
              raise SystemExit("no media files found")
          # CI checkouts give every file the same mtime, so "newest" must be
          # by path: render folders are date-named, the latest path IS the
          # newest render. Polling it waits for the new Pages deploy.
          newest = max(files, key=lambda f: f.as_posix())
          url = f"{base}/{newest.relative_to('docs').as_posix()}"
          for _ in range(20):
              try:
                  if requests.head(url, timeout=10).status_code == 200:
                      print("served:", url)
                      break
              except Exception:
                  pass
              time.sleep(30)
          else:
              raise SystemExit(f"Pages not serving {url} yet")
          PY

      - name: Publish to Instagram + Facebook
        if: steps.slot.outputs.run == 'true'
        run: python scripts/publish.py --today --format ${{ steps.slot.outputs.format }}

      - name: Commit publish log (so later triggers see today's post)
        if: steps.slot.outputs.run == 'true'
        run: |
          git add data/published_log.csv
          git commit -m "log: published $(date -u +%FT%HZ)" || echo "no log change"
          git pull --rebase origin main || true
          git push
