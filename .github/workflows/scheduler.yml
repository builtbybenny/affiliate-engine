name: scheduler
on:
  schedule:
    # Ramp ended 2026-10-12 (health gate cleared): back to 2/day — morning
    # carousel + evening reel. Deliberately odd minutes: rounded times are a
    # bot tell. Each window has triggers + a guard + a random draw so each
    # format posts exactly once/day at a different time every day.
    # Carousel (morning ET):
    - cron: "11 12 * * *"  # ~08:11 ET
    - cron: "29 12 * * *"  # ~08:29 ET
    - cron: "47 12 * * *"  # ~08:47 ET forced fallback
    # Insurance: the 12:11-12:47 window lost every run 2026-10-21..24 to the
    # Pages race. The guard skips this trigger when the carousel already
    # published, so it only costs a run when the morning window failed.
    - cron: "41 13 * * *"  # ~09:41 ET last-ditch retry
    # Reel (evening US-prime):
    - cron: "9 23 * * *"   # ~19:09 ET
    - cron: "27 23 * * *"  # ~19:27 ET
    - cron: "46 23 * * *"  # ~19:46 ET
    - cron: "57 23 * * *"  # ~19:57 ET forced fallback
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: affiliate-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      GRAPH_VERSION: v23.0
      BRAND_NAME: Stack & Save
      BRAND_HANDLE: "@stackandsavehq"
      # Optional boosters: empty secret = graceful fallback (templates/gradients)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
      VECTEEZY_ACCOUNT_ID: ${{ secrets.VECTEEZY_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute Pages URL (free hosting)
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          REPO=${GITHUB_REPOSITORY#*/}
          echo "PUBLIC_MEDIA_BASE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"

      - name: Decide today's slot (per-format guard + randomized draw)
        id: slot
        run: |
          python - <<'PY'
          import csv, datetime, os, random
          utc = datetime.datetime.utcnow()
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          ist_now = utc + datetime.timedelta(hours=5, minutes=30)
          fmt = "carousel" if 11 <= utc.hour < 18 else "reel"
          # Per-format guard (ramp-end fix, 2026-10-02 ratification): the old
          # date-only guard saw the evening reel's log row (which lands under
          # the NEXT IST date, since 23:xx UTC = next-day IST) and skipped the
          # morning carousel thinking "already posted". The guard must ask has
          # THIS FORMAT been posted for the IST date the row would carry.
          row_date = ist_now.date().isoformat()
          done = set()
          try:
              with open("data/published_log.csv", newline="", encoding="utf-8") as f:
                  done = {(r[0], r[1]) for r in list(csv.reader(f))[1:] if len(r) >= 2}
          except FileNotFoundError:
              pass
          if manual:
              run, why = True, "manual dispatch"
          elif (row_date, fmt) in done:
              run, why = False, f"guard: {fmt} already posted for {row_date}"
          elif fmt == "carousel":
              # Morning window: 12:11 draw, 12:29 higher, 12:47 forced.
              if (utc.hour, utc.minute) >= (12, 47):
                  run, why = True, "last carousel trigger — forced"
              else:
                  p = 0.35 if (utc.hour, utc.minute) < (12, 29) else 0.6
                  run = random.random() < p
                  why = f"carousel draw p={p} -> {'post' if run else 'pass'}"
          else:
              # Reel window: 23:09 draw, 23:27 higher, 23:46 gate, 23:57 forced.
              if (utc.hour, utc.minute) >= (23, 55):
                  run, why = True, "last trigger of the window — forced"
              else:
                  t = (utc.hour, utc.minute)
                  p = 0.35 if t < (23, 20) else 0.55 if t < (23, 40) else 0.7
                  run = random.random() < p
                  why = f"reel draw p={p} -> {'post' if run else 'pass'}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"format={fmt}\nrun={str(run).lower()}\n")
          print(f"{fmt} @ {utc:%H:%M}Z: {why}")
          PY

      # Fail-fast guard for the 2026-10-06 outage: the ACCESS_TOKEN secret
      # expired (code 190) and three runs burned a full generate+deploy before
      # dying on the very first IG call. Validate the token up front so an
      # expiry fails in seconds with a pointed error, not 11 minutes later.
      - name: Meta token preflight (fail fast before the build)
        if: steps.slot.outputs.run == 'true'
        run: |
          python - <<'PY'
          import datetime, json, os, sys, time, urllib.error, urllib.parse, urllib.request

          tok = os.environ.get("ACCESS_TOKEN", "")
          ig = os.environ.get("IG_USER_ID", "")
          app = os.environ.get("META_APP_ID", "")
          sec = os.environ.get("META_APP_SECRET", "")
          ver = os.environ.get("GRAPH_VERSION", "v23.0")

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  try:
                      return json.loads(body)
                  except Exception:
                      return {"error": {"message": body[:300], "code": e.code}}
              except Exception as exc:
                  return {"error": {"message": f"request failed: {exc}"}}

          if not tok:
              die("ACCESS_TOKEN secret is empty")
          if app and sec:
              resp = get(
                  f"https://graph.facebook.com/{ver}/debug_token"
                  f"?input_token={urllib.parse.quote(tok)}&access_token={urllib.parse.quote(app + '|' + sec)}"
              )
              data = resp.get("data") or {}
              if not data:
                  die(f"debug_token gave no data - refresh the ACCESS_TOKEN secret from .env: {resp}")
              if not data.get("is_valid"):
                  die(f"Meta token invalid/expired - refresh the ACCESS_TOKEN secret from .env: {data}")
              exp = int(data.get("expires_at") or 0)
              if exp and exp <= time.time() + 86400:
                  when = datetime.datetime.fromtimestamp(exp, datetime.timezone.utc)
                  die(f"Meta token expires {when:%Y-%m-%d %H:%MZ} - refresh the ACCESS_TOKEN secret now")
              missing = sorted({"instagram_content_publish", "instagram_manage_comments"} - set(data.get("scopes") or []))
              if missing:
                  die(f"ACCESS_TOKEN is missing scopes: {missing}")
              print(f"Meta token OK (expires_at={exp or 'never'})")
          else:
              probe = get(f"https://graph.facebook.com/{ver}/{ig}/media?fields=id&limit=1&access_token={urllib.parse.quote(tok)}")
              if "error" in probe:
                  die(f"Meta rejected ACCESS_TOKEN: {probe['error']}")
              print("Meta token OK (live read; no app creds for debug_token)")
          PY

      - name: Randomize exact time inside the slot
        if: steps.slot.outputs.run == 'true'
        run: sleep $((RANDOM % 170))

      # Reels are rendered with ffmpeg; runner images do NOT ship it
      # (first-ever run failed 2026-10-01 on exactly this).
      - name: Install ffmpeg (video)
        if: steps.slot.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install deps
        if: steps.slot.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate media
        if: steps.slot.outputs.run == 'true'
        run: python scripts/generate.py --today --format ${{ steps.slot.outputs.format }}

      - name: Copy media into docs/ for GitHub Pages
        if: steps.slot.outputs.run == 'true'
        run: |
          mkdir -p docs/media
          cp -r public/media/* docs/media/
          # keep the link-in-bio page in sync with products.csv
          if [ -f public/index.html ]; then cp public/index.html docs/index.html; fi

      - name: Commit media to Pages
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/media
          # X posting queue (make_x_queue.py mirrors public/x into docs/x;
          # without this line the INDEX stays local until the next manual push)
          if [ -d docs/x ]; then git add -f docs/x; fi
          git commit -m "media: ${{ steps.slot.outputs.format }} $(date -u +%FT%HZ)" || echo "nothing to commit"
          git push

      - name: Wait until Pages serves the new files
        if: steps.slot.outputs.run == 'true'
        env:
          FMT: ${{ steps.slot.outputs.format }}
        run: |
          sleep 60
          python - <<'PY'
          import os, time, requests
          from pathlib import Path
          base = os.environ["PUBLIC_MEDIA_BASE_URL"]
          fmt = os.environ.get("FMT", "")
          # Scope the wait to the format we are about to publish. Scanning all
          # of docs/media picked media/reels/... (r sorts after c), i.e. an OLD
          # reel file that was already live, so the check passed instantly and
          # publishing raced ahead of the Pages deploy -> Meta fetched HTML
          # instead of the slide -> error 9004 on every morning carousel from
          # 2026-10-21 to 2026-10-24. publish.py then re-checks the exact URLs.
          sub = "carousels" if fmt == "carousel" else "reels"
          root = Path("docs") / "media" / sub
          files = [f for f in root.rglob("*") if f.is_file()]
          if not files:
              raise SystemExit(f"no {fmt} media files under {root}")
          # CI checkouts give every file the same mtime, so "newest" must be
          # by path: render folders are date-named, the latest path IS the
          # newest render. Polling it waits for the new Pages deploy.
          newest = max(files, key=lambda f: f.as_posix())
          url = f"{base}/{newest.relative_to('docs').as_posix()}"
          for _ in range(20):
              try:
                  if requests.head(url, timeout=10).status_code == 200:
                      print("served:", url)
                      break
              except Exception:
                  pass
              time.sleep(30)
          else:
              raise SystemExit(f"Pages not serving {url} yet")
          PY

      - name: Publish to Instagram + Facebook
        if: steps.slot.outputs.run == 'true'
        run: python scripts/publish.py --today --format ${{ steps.slot.outputs.format }}

      - name: Build today's X queue entry + mirror to docs/x
        if: steps.slot.outputs.run == 'true'
        run: python scripts/make_x_queue.py

      - name: Commit publish log + rotation memory + X queue (so later triggers see
        # today's post, LRU product rotation learns from CI posts, and the X
        # posting queue grows one entry per publish instead of falling behind)
        if: steps.slot.outputs.run == 'true'
        run: |
          git add data/published_log.csv data/concept_history.json data/research_briefs.json
          # media/music reuse memory (only exists once a reel has rendered)
          git add data/asset_history.json 2>/dev/null || true
          git add -f docs/x
          git commit -m "log: published $(date -u +%FT%HZ) + rotation state + X queue" || echo "no changes"
          git pull --rebase origin main || true
          git push
